"doi:10.1038/s41590-025-02398-y": "Shows that immune cells in the mouth's lining organize into distinct spatial zones rather than mixing randomly, a pattern that shapes how oral tissue defends against infection."
"doi:10.1016/j.immuni.2024.02.020": "Identifies a signal (IL-23) made by cells lining the mouth that drives damaging inflammation, pointing to a possible new target for treating oral inflammatory disease."
"doi:10.1016/j.cell.2021.05.013": "Maps the cell types in healthy and diseased mouth tissue, showing that connective-tissue cells, not just immune cells, help recruit the white blood cells that drive gum disease."
"doi:10.1126/science.aay5731": "Finds that in a rare immune disorder, an overactive immune response, not a weak one, damages the mouth's protective lining and lets fungal infections take hold, the opposite of what researchers expected."
"doi:10.1038/s41586-020-2745-3": "Shows that a pregnant mouse's gut bacteria help shape her fetus's brain wiring, likely by sending chemical signals that reach the developing brain."
"doi:10.1126/sciadv.adk1887": "Shows that a pregnant mouse's gut bacteria are needed for the placenta to grow properly and form healthy blood vessels, and that a bacterial byproduct can restore this even under poor nutrition."
"doi:10.1084/jem.20221751": "Identifies a type of immune-cell trap as an early trigger of the bone-destroying inflammation in gum disease, revealing a new step in how periodontitis develops."
